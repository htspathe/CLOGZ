api_version = "2026-10"

[[extensions]]
type = "ui_extension"
name = "CLOGZ — Merci et suivi"
handle = "clogz-merci-suivi"

[[extensions.targeting]]
target = "purchase.thank-you.block.render"
module = "./src/ThankYou.jsx"
default_placement = "ORDER_STATUS1"

[extensions.capabilities]
network_access = true

[extensions.settings]
[[extensions.settings.fields]]
key = "api_url"
type = "single_line_text_field"
name = "URL du service CLOGZ"
description = "Adresse HTTPS du serveur de suivi. Laissez vide tant que ce service n'est pas sécurisé et configuré."
