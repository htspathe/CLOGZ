<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLOGZ V3 · Studio motion</title>
<style>@font-face{font-family:Bricolage;src:url(assets/Bricolage-static.ttf);font-weight:800}@font-face{font-family:Instrument;src:url(assets/Instrument-static.ttf);font-weight:500}*{box-sizing:border-box}body{margin:0;background:#191817;color:#fff8f1;font:15px Instrument,Arial;display:grid;grid-template-columns:300px 1fr;min-height:100vh}aside{padding:35px 26px;border-right:1px solid #ffffff22}h1{font:800 40px Bricolage;margin:0 0 5px}p{line-height:1.6;color:#c7b6ab}select,button{background:#fff8f1;border:0;border-radius:8px;padding:13px;color:#191817;font:inherit;width:100%;margin:7px 0}button{background:#ee4a3d;color:white;cursor:pointer}main{padding:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}canvas{max-height:80vh;max-width:100%;width:auto;height:auto;box-shadow:0 20px 90px #0006}.controls{width:min(750px,100%);display:flex;align-items:center;gap:14px}input{width:100%;accent-color:#ee4a3d}.note{font-size:12px}time{min-width:86px}#state{color:#fbe2d5}@media(max-width:760px){body{display:block}aside{padding:20px}aside p{display:none}aside select,aside button{width:48%}main{padding:15px}canvas{max-height:70vh}}</style>
<aside><h1>CLOGZ.</h1><div>STUDIO MOTION / V3</div><p>Produits authentiques.<br>Montage déterministe.<br>Quatre compositions.</p><select id="variant"><option value="master">Master vertical · 40 s</option><option value="reel">Reel · 30 s</option><option value="teaser">Teaser · 15 s</option><option value="youtube">YouTube · 43 s</option></select><button id="play">Lire l’aperçu</button><p class="note">Préversion : interfaces illustrées d’après la V3. Voix française provisoire, distincte de la voix choisie. Les MP4 et pistes séparées permettent la finition.</p><p id="state">Chargement des médias…</p></aside><main><canvas id="film"></canvas><div class="controls"><input id="scrub" type="range" min="0" max="40" step="0.01" value="0"><time id="clock">0.00 / 40 s</time></div></main>
<script src="preview-data.js"></script><script src="motion.js"></script><script>
(async()=>{const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),select=document.querySelector('select'),scrub=document.querySelector('input'),clock=document.querySelector('time'),button=document.querySelector('button');await document.fonts.ready;let assets={};await Promise.all(PREVIEW.assets.map(async f=>{let im=new Image;im.src='assets/'+f;await im.decode();assets[f.replace(/\.[^.]+$/,'')]=im}));let movie=createMotion(ctx,assets,PREVIEW.config,PREVIEW.bounds),t=0,playing=false,last=0,variant='master',audio=new Audio();audio.preload='auto';
function setup(){variant=select.value;let v=PREVIEW.config.variants[variant];canvas.width=v.width;canvas.height=v.height;scrub.max=v.scenes.reduce((a,s)=>a+s[1],0);t=0;audio.src='output/'+variant+'-mix.wav';movie.seek(0,variant);scrub.value=0;clock.textContent='0.00 / '+scrub.max+' s'}
window.seek=(seconds)=>{t=Math.max(0,Math.min(+scrub.max,seconds));movie.seek(t,variant);scrub.value=t;clock.textContent=t.toFixed(2)+' / '+scrub.max+' s'};setup();select.onchange=()=>{playing=false;audio.pause();setup();button.textContent='Lire l’aperçu'};scrub.oninput=()=>{window.seek(+scrub.value);audio.currentTime=t};button.onclick=()=>{playing=!playing;if(playing){if(t>=+scrub.max-.05)window.seek(0);audio.currentTime=t;audio.play().catch(()=>{});last=performance.now()}else audio.pause();button.textContent=playing?'Pause':'Lire l’aperçu'};
function tick(now){if(playing){t+=(now-last)/1000;window.seek(t);if(t>=+scrub.max){playing=false;audio.pause();button.textContent='Relire'}}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);document.querySelector('#state').textContent=matchMedia('(prefers-reduced-motion: reduce)').matches?'Lecture manuelle · mouvements réduits respectés.':'Prêt · aucun démarrage automatique.';
})();</script></html>
